name: Build LecteurPro APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dezipper
        run: unzip -o LecteurPro.zip || unzip -o *.zip
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: |
          cd LecteurPro
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LecteurPro-APK
          path: LecteurPro/app/build/outputs/apk/debug/*.apk
