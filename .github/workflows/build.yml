name: Build LecteurPro APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Dezipper le projet
        run: |
          unzip -o LecteurPro.zip
          # Si ton projet est dans un sous-dossier, on le remonte
          if [ ! -f gradlew ] && [ -f */gradlew ]; then
            mv */* . || true
            mv */.* . || true
          fi
          ls -la

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compiler l'APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LecteurPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
