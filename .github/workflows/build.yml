name: Build LecteurPro APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Dezipper le projet
        run: |
          unzip -o LecteurPro.zip || unzip -o *.zip
          echo "--- fichiers ---"
          ls -la
          find . -name gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compiler l'APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew introuvable"
            find . -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Trouvé dans $DIR"
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LecteurPro-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
